# ============================================================
# 数据生产配置
# 所有数字都是「调用几次」，没有百分比。
# 想多要某一种数据，就把对应的调用次数调大。
# ============================================================


# ---------- 调用参数 ----------

n: 5                            # 对话阶段：每次调用让模型写几段对话
scenario_n: 20                  # 场景卡阶段：每次调用让模型写几张卡
k: 4                            # 同时开几路调用

persona: personas/default.md    # 人设文件，打包时原样贴进 system 字段
output_dir: output/


# ---------- 长度档位 ----------
# 模型数不清字数，给它百分比没用，只能给一句话描述这批对话大概多长。
# 下面每一段文字会原样填进提示词的 {answer_length} 位置。
#
# 五档的区别只在「有没有一段长的、多长」。每一档都写了「其余仍然短」，
# 这句是防止一段对话里每条消息都一样长。
#
# 想多要短对话 → 把下面 domains 里 P1 的调用次数调大。

profiles:
  P1: "全程短回复来回，最长的一条不超过 30 字"
  P2: "以短句为主，偶尔一条到 60 至 80 字，其余仍然短"
  P3: "短句为底，其中一到两轮展开到 100 字左右，其余仍然短"
  P4: "短句为底，其中一轮讲一段完整的事，150 到 250 字，其余仍然短"
  P5: "短句为底，其中一轮一口气讲了很多，300 字上下，其余仍然短"

# 检查脚本用：这一档里单条 assistant 回复超过多少字判失败
max_chars:
  P1: 40
  P2: 100
  P3: 130
  P4: 280
  P5: 400


# ---------- 轮数 ----------
# 一轮 = user 说一次 + assistant 回一次。
# 代码按下面的权重给每段对话抽一个轮数，写进场景卡的 turns 字段。
# weight 是相对值，不用凑成 100，改一个数字其他的自动重新归一。

turns_default:
  - {range: [1, 1],   weight: 10}   # 一来一回就结束
  - {range: [2, 4],   weight: 25}
  - {range: [5, 8],   weight: 35}
  - {range: [9, 14],  weight: 22}
  - {range: [15, 20], weight: 8}    # 长对话


# ---------- 领域 ----------
# 每个领域两组数字：
#
#   scenario_calls   场景卡阶段调用几次，每次产 scenario_n 张卡
#   dialogue_calls   对话阶段每个长度档位各调用几次，每次产 n 段对话
#
# 这个领域产出多少段对话 = dialogue_calls 里所有数字相加 × n
# 需要多少张场景卡 = 同上
# 实际要产的卡 = scenario_calls × scenario_n，比需求多两成左右，
# 因为去重会丢掉一部分。
#
# dialogue_calls 的 key 就是这个领域允许用的档位，没写的档位不会被用到。
# 情绪倾诉不该出现 300 字的大段，所以 emotion 只开到 P3。
#
# turns 可选，不写就用上面的 turns_default。

domains:

  emotion:
    scenario_calls: 14            # 14 × 20 = 280 张卡
    dialogue_calls:
      P1: 12
      P2: 20
      P3: 14                      # (12+20+14) × 5 = 230 段对话
    turns:                        # 情绪对话不要太长
      - {range: [2, 4],  weight: 30}
      - {range: [5, 8],  weight: 45}
      - {range: [9, 14], weight: 25}

  knowledge:
    scenario_calls: 12            # 12 × 20 = 240 张卡
    dialogue_calls:
      P2: 10
      P3: 16
      P4: 14
      P5: 6                       # (10+16+14+6) × 5 = 230 段对话


# ============================================================
# 上面这份配置一共会发多少次调用：
#   场景卡  14 + 12                     = 26 次
#   对话    (12+20+14) + (10+16+14+6)   = 92 次
#   合计                                = 118 次
#   产出    92 × 5                      = 460 段对话
#
# 跑之前用 plan.py 核对一遍，它会把这些数算给你看。
# ============================================================
