# ============================================================
# 数据生产配置
#
# 所有数字都是「调用几次」或「几轮」，没有百分比，没有概率权重。
# 想多要某一种数据，就把对应的 calls 调大。
# ============================================================


# ---------- 调用参数 ----------

n: 5                            # 对话阶段：每次调用让模型写几段对话
scenario_n: 20                  # 场景卡阶段：每次调用让模型写几张卡
k: 4                            # 同时开几路调用

persona: personas/default.md    # 人设文件，打包时原样贴进 system 字段
output_dir: output/


# ---------- 长度档位 ----------
# 模型数不清字数，给它百分比没用，只能给一句话描述这批对话大概多长。
# 下面每一段文字会原样填进提示词的 {answer_length} 位置。
#
# 档位说的是一段对话内部的长短起伏，不是给每条消息定一个字数。
# 比如 P2 的一段 6 轮对话，实际字数可能是 5 / 4 / 55 / 6 / 5 / 2，
# 最短和最长差几十倍。
#
# 五档的区别只在「那条长的有多长」，以及有没有。
# 每一档都写了「其余仍然短」，这句防止段内均匀。

profiles:
  P1: "全程短回复来回，最长的一条不超过 30 字"
  P2: "以短句为主，偶尔一条到 60 至 80 字，其余仍然短"
  P3: "短句为底，其中一到两轮展开到 100 字左右，其余仍然短"
  P4: "短句为底，其中一轮讲一段完整的事，150 到 250 字，其余仍然短"
  P5: "短句为底，其中一轮一口气讲了很多，300 字上下，其余仍然短"

# 检查脚本用：这一档里单条 assistant 回复超过多少字判失败
max_chars:
  P1: 40
  P2: 100
  P3: 130
  P4: 280
  P5: 400


# ---------- 领域 ----------
#
# scenario_calls   场景卡阶段调用几次，每次产 scenario_n 张卡
#
# dialogue_calls   一个列表，每行三个数字：
#                    profile  用哪个长度档
#                    turns    这批对话每段几轮（一轮 = user 说一次 + assistant 回一次）
#                    calls    这一行调用几次
#                  这一行产出 calls × n 段对话
#
# 领域产出总数 = 所有行的 calls 相加 × n
# 需要的场景卡数 = 同上
# 实际要产的卡 = scenario_calls × scenario_n，比需求多两成左右，去重会丢一部分
#
# 用到的 profile 由这些行决定，没出现的档位不会被用。
# 情绪倾诉不该出现 300 字大段，所以 emotion 里没有 P4 P5。

domains:

  emotion:
    scenario_calls: 14              # 14 × 20 = 280 张卡
    dialogue_calls:
      - {profile: P1, turns: 2,  calls: 4}
      - {profile: P1, turns: 4,  calls: 8}
      - {profile: P2, turns: 6,  calls: 12}
      - {profile: P2, turns: 8,  calls: 8}
      - {profile: P3, turns: 6,  calls: 6}
      - {profile: P3, turns: 10, calls: 8}
      # 46 次调用 × 5 = 230 段对话

  knowledge:
    scenario_calls: 14              # 14 × 20 = 280 张卡
    dialogue_calls:
      - {profile: P2, turns: 4,  calls: 6}
      - {profile: P2, turns: 8,  calls: 6}
      - {profile: P3, turns: 6,  calls: 8}
      - {profile: P3, turns: 10, calls: 8}
      - {profile: P4, turns: 8,  calls: 7}
      - {profile: P4, turns: 12, calls: 5}
      - {profile: P5, turns: 10, calls: 4}
      - {profile: P5, turns: 14, calls: 2}
      # 46 次调用 × 5 = 230 段对话


# ============================================================
# 这份配置一共发多少次调用：
#   场景卡  14 + 14   = 28 次
#   对话    46 + 46   = 92 次
#   合计              = 120 次
#   产出    92 × 5    = 460 段对话
#
# 跑之前用 plan.py 核对，它会把这些数算给你看。
# ============================================================
