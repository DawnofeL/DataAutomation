# ---------- 路径 ----------
input_dir: input/
output_dir: output/
persona: personas/default.md


# ---------- 调用 ----------
dialogue_gen_per_call: 5      # 每次调用产出几段对话
concurrency: 4                # 同时开几路
model: deepseek-chat
max_retry: 2                  # 格式坏了或轮数不对，重发几次


# ---------- 这批对话的形状 ----------
profile: P2                   # 用哪个长度形状，见下
turns: 8                      # 每段几轮。8 轮 = user 说 8 次 + assistant 回 8 次 = 16 条消息


# ---------- 长度形状 ----------
# 模型数不清字数，只能给一句话描述这批对话大概什么形状。
# 下面的文字会原样填进 prompts/user.md 的 {answer_length} 位置。
#
# 说的是一段对话内部的长短起伏，不是给每条消息定一个字数。
# P2 的一段 8 轮对话，实际字数可能是 9 / 13 / 6 / 64 / 12 / 9 / 1 / 9。
#
# 五档的区别只在「那条长的有多长」，以及有没有。

profiles:
  P1: "全程短回复来回，最长的一条不超过 30 字"
  P2: "以短句为主，偶尔一条到 60 至 80 字，其余仍然短"
  P3: "短句为底，其中一到两轮展开到 100 字左右，其余仍然短"
  P4: "短句为底，其中一轮讲一段完整的事，150 到 250 字，其余仍然短"
  P5: "短句为底，其中一轮一口气讲了很多，300 字上下，其余仍然短"

# 质检用：单条 assistant 消息超过这个字数判失败
profile_max_chars:
  P1: 40
  P2: 100
  P3: 130
  P4: 280
  P5: 400
